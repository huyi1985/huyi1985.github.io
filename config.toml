# 中文计算机历史知识站 — Hugo 配置
# 域名注册后修改 baseURL；广告位默认关闭，接入联盟后启用

baseURL = "https://huyi1985.github.io/"    # GitHub Pages 根路径
languageCode = "zh-CN"
title = "计算机历史 · 奇闻与资料库"
enableRobotsTXT = true
pygmentsCodeFences = true

# 首页/列表分页：每页 20 篇（228 篇 → 约 12 页）
paginate = 20

# md.d/ 作为 content 目录（脚本产物直接消费）
contentDir = "md.d"

# 文章以 page bundle 组织：md.d/posts/<文章名>/index.md + 同目录图片（相对引用）
# permalinks 去掉 posts/ 前缀并保留完整目录名（含日期前缀），保持 URL 与旧扁平结构一致
# （:slug 会剥离 YAML 日期前缀，故用 :filename = bundle 目录名）
[permalinks]
  posts = "/:filename/"

[params]
  description = "中文计算机历史资料库与奇闻故事库：Unix、Windows、编程语言、老软件、人物与冷知识"
  orderBy = "date"
  # 广告位开关：接入广告联盟后改为 true
  [params.ads]
    enabled = false
    slot_below_content = ""   # 广告联盟提供的广告位 ID
    slot_sidebar = ""

  # 网站统计：三选一或多选，留空即不启用；拿到哪个的 ID 填进去即自动注入对应脚本
  # - google:   GA4 Measurement ID，形如 "G-XXXXXXXXXX"
  # - cloudflare: Cloudflare Web Analytics 的 beacon token（一串十六进制）
  # - goatcount: GoatCount 站点 code（自托管则填完整域名/code，如 "myblog"）
  [params.analytics]
    google = ""
    cloudflare = ""
    goatcount = "damiaozi"

# 标签筛选：Hugo taxonomy
[taxonomies]
  tag = "tags"

# RSS：订阅条目上限（默认 50；中文站更新慢，30 够覆盖一两个月）
[services.rss]
limit = 30
